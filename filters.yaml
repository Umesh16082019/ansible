- name: demo on filters
  hosts: local
  connection: local
  vars:
    course: "DevOps with Ansible"
    myIp: "246.457.390.258"
  tasks:
  - name: greeting
    ansible.builtin.debug:
      msg: "Hi Umesh, {{ GREETING | default('Good Morning') }}"

  - name: convert to uppercase
    ansible.builtin.debug:
      msg: "{{ course | upper }}"

  - name: convert to lowercase
    ansible.builtin.debug:
      msg: "{{ course | lower }}"
      
  - name: check IPv4
    ansible.builtin.debug:
      msg: "{{ myIp | ansible.utils.ipv4 }}"
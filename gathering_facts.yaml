- name: gathering facts
  hosts: local
  connection: local
  tasks:
  - name: print facts
    ansible.builtin.debug:
      msg: "{{ ansible_facts}}"

  - name: check if it is Redhat or not
    ansible.builtin.debug:
      msg: "Yes, it is Redhat"
    when: ansible_facts.os_family == "RedHat"

  - name: check if it is Debian or not
    ansible.builtin.debug:
      msg: "Yes, it is Debian"
    when: ansible_facts.os_family == "Debian"
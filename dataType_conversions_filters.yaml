- name: data type conversions
  hosts: local
  connection: local
  vars:
    topics: AWS, Ansible, Docker, Terraform
    tagsList:
      name: ansible
      project: roboshop
      component: catalogue
    tagsMap: [
        {
            "key": "name",
            "value": "ansible"
        },
        {
            "key": "project",
            "value": "roboshop"
        },
        {
            "key": "component",
            "value": "catalogue"
        }
    ]

  tasks:
  - name: string to list 
    ansible.builtin.debug:
      msg: "{{ topics | split (',') }}"
  
  - name: map to list 
    ansible.builtin.debug:
      msg: "{{ tagsList | dict2items }}"

  - name: list to map 
    ansible.builtin.debug:
      msg: "{{ tagsMap | items2dict }}"

